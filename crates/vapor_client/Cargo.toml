[package]
name = "vapor_client"
version.workspace = true
edition.workspace = true

[dependencies]
interprocess = "2.4"
serde_json = "1"
vapor_client_domain = { path = "../vapor_client_domain" }
vapor_client_protocol = { path = "../vapor_client_protocol" }

[target."cfg(windows)".dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
