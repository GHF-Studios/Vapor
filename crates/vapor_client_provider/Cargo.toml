[package]
name = "vapor_client_provider"
version.workspace = true
edition.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22.27"
vapor_core = { path = "../vapor_core" }
vapor_content = { path = "../vapor_content" }
vapor_client_domain = { path = "../vapor_client_domain" }
