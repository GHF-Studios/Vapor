[package]
name = "vapor_core"
version.workspace = true
edition.workspace = true

[dependencies]
vapor_console_core = { path = "../vapor_console_core" }
vapor_telemetry = { path = "../vapor_telemetry" }
vapor_content = { path = "../vapor_content" }
vapor_product_layout = { path = "../vapor_product_layout" }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1"
pathdiff = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ring = "0.17.14"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crc32fast = "1.5"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
